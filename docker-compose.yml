# 운영(리눅스 서버) 기본 구성:  docker compose up -d --build
# 맥 개발용:  docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
# 비밀값은 루트 .env 에서 읽음 (.env.example 참고)

# 컨테이너 로그 크기 제한 (서버 디스크 보호)
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: mariadb:10.11
    container_name: sool-mariadb
    restart: unless-stopped
    logging: *logging
    mem_limit: 768m
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MARIADB_DATABASE: ${DB_NAME:-sool}
      MARIADB_USER: ${DB_USER:-sool}
      MARIADB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    # 운영에서는 DB 포트를 외부에 열지 않음 (백엔드만 내부 네트워크로 접근)
    volumes:
      - sool_mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: sool-backend
    restart: unless-stopped
    logging: *logging
    mem_limit: 768m
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: ${DB_USER:-sool}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-sool}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      db:
        condition: service_healthy
    # 백엔드도 외부 미노출: 브라우저 → frontend(/api/proxy) → backend:8000

  frontend:
    build:
      context: ./frontend
      target: runner
    container_name: sool-frontend
    restart: unless-stopped
    logging: *logging
    mem_limit: 512m
    environment:
      BACKEND_URL: http://backend:8000
      GIT_BRANCH: ${GIT_BRANCH:-unknown-branch}
      GIT_SHA: ${GIT_SHA:-unknown-sha}
    ports:
      - "${FRONT_BIND:-127.0.0.1}:${FRONT_PORT:-3300}:3000"
    depends_on:
      - backend

  # 데이터 파이프라인 (상시 실행 아님): docker compose --profile pipeline run --rm pipeline
  #   계정: 서비스 테이블 SELECT 전용 (ops/create-pipeline-user.sh)
  pipeline:
    build: ./pipelines
    container_name: sool-pipeline
    profiles: ["pipeline"]
    logging: *logging
    mem_limit: 1g
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: sool_pipeline
      DB_PASSWORD: ${PIPELINE_DB_PASSWORD:-}
      DB_NAME: ${DB_NAME:-sool}
    volumes:
      - ./data/pipeline:/data
      - ./backend/data:/seed:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  sool_mariadb_data:
