# sool-pipeline 설정. DB 접속 정보는 환경변수(DB_HOST/DB_USER/DB_PASSWORD/DB_NAME)로 받는다.

# ① collect: 스냅샷할 서비스 테이블 (users 는 개인정보라 제외, *_v2 는 미사용 레거시라 제외)
snapshot_tables:
  - sool
  - reviews
  - sense
  - tasting_notes

# 원본 CSV 시드 (DB 에 없는 특징·주소·인증·수상·용량). 컨테이너에는 /seed 로 마운트
seed_csv: /seed/sool_basic_clean.csv
# CSV 열 순서 → 이름 (원본 헤더에 'notes' 가 두 번 나와서 위치로 매핑)
seed_columns: [name, description, abv, volume, ingredients, special_notes, features,
               available, producer, address, homepage, awards]

# ① collect: 양조장 주소 → 좌표 (카카오 로컬). 캐시에 없는 것만 호출
geocode:
  enabled: true
  max_calls: 2000        # 한 번 실행에 최대 호출 수 (일 한도 10만)

# ① collect: 홈페이지 링크 생존 검사 (주 1회 재검사)
link_check:
  enabled: true
  recheck_days: 7
  workers: 8
  timeout: 8
  max_checks: 2000

# ② clean: 품질 검사 기준
quality:
  abv_range: [0.5, 70]

# ① collect: 제품별 블로그 후기 검색 (카카오 블로그 검색, 주 1회 갱신)
blog_search:
  enabled: true
  refresh_days: 7
  max_calls: 1500        # 한 번 실행에 최대 호출 수
  fetch_size: 15         # 검색 결과를 이만큼 받아서
  per_product: 5         # 술 이름이 나오는 글만 최대 이만큼 공개

# ① collect: aT 전통주정보(공공데이터포털 15048755) 새 판 확인. 바뀌었을 때만 저장·비교 → data/pipeline/sources/at/
at_source:
  enabled: true
  check_days: 7          # 연 1회 갱신이라 주 1회 확인이면 충분

# ① collect: 양조 원료 시세 (aT 일별 도·소매 가격, 중도매). 월 단위, 없는 달만 + 최근 달은 매번 다시
ingredient_prices:
  enabled: true
  start_month: "2021-01"
  refresh_months: 2
  max_calls: 2000        # 개발 계정 하루 1만 건
