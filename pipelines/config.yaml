# sool-pipeline 설정. DB 접속 정보는 환경변수(DB_HOST/DB_USER/DB_PASSWORD/DB_NAME)로 받는다.

# ① collect: 스냅샷할 서비스 테이블 (users 는 개인정보라 제외, *_v2 는 미사용 레거시라 제외)
snapshot_tables:
  - sool
  - reviews
  - sense
  - tasting_notes

# 원본 CSV 시드 (DB 에 없는 특징·주소·인증·수상·용량). 컨테이너에는 /seed 로 마운트
seed_csv: /seed/sool_basic_clean.csv
# CSV 열 순서 → 이름 (원본 헤더에 'notes' 가 두 번 나와서 위치로 매핑)
seed_columns: [name, description, abv, volume, ingredients, special_notes, features,
               available, producer, address, homepage, awards]

# ① collect: 양조장 주소 → 좌표 (카카오 로컬). 캐시에 없는 것만 호출
geocode:
  enabled: true
  max_calls: 2000        # 한 번 실행에 최대 호출 수 (일 한도 10만)

# ② clean: 품질 검사 기준
quality:
  abv_range: [0.5, 70]
